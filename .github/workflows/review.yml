name: Review checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify and package offline review
        run: npm run review:artifacts -- --output "$RUNNER_TEMP/tabby-offline-review"
      - name: Upload checked offline evidence and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabby-offline-review-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabby-offline-review/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

  local-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - run: npm ci --ignore-scripts
      - name: Prepare isolated execution image
        run: docker pull python:3.12-alpine@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
      - name: Verify and package fresh local economic loops
        run: npm run review:artifacts -- --execute-local --output "$RUNNER_TEMP/tabby-local-review"
      - name: Upload checked fresh evidence and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabby-local-review-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabby-local-review/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
